spring:
  application:
    name: sogone
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_SMTP_USERNAME}
    password: ${GOOGLE_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

jwt:
  secret-key: ${JWT_SECRET}
  access-expiration: 30m
  refresh-expiration: 30d
  cookie:
    name: refreshToken
    path: /api/auth
    secure: true
    same-site: Strict

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

oauth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-ids: ${GOOGLE_CLIENT_IDS}
  apple:
    client-ids: ${APPLE_CLIENT_IDS}
